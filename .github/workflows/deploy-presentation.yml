name: Deploy Presentation to GitHub Pages

on:
  push:
    branches: ["main"]
    # Opcional: solo ejecutar si hay cambios en la carpeta de la presentación o en este archivo
    paths:
      - 'Presentation/**'
      - '.github/workflows/deploy-presentation.yml'
  workflow_dispatch:

# Permisos necesarios para subir a GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Prepare Presentation Folder
        run: |
          # Duplicamos la presentación principal a index.html para que GitHub Pages la abra por defecto
          cp "Presentation/FitHealth Presentation.html" Presentation/index.html || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './Presentation'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
